name: Update upstream tools

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update pinned versions and checksums
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_upstream.py
      - name: Open update pull request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/upstream-tools
          delete-branch: true
          add-paths: plugin/nebula.plg
          commit-message: ${{ steps.versions.outputs.title }}
          title: ${{ steps.versions.outputs.title }}
          body-path: ${{ runner.temp }}/nebula-updates.md
      - name: Run CI on the update branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build.yml --ref automation/upstream-tools
